<section class="hero">
  <div class="hero-dots" aria-hidden="true"></div>
  <div class="hero-spot" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true" style="width:1100px;height:1100px;right:-280px;top:-200px"></div>
  <div class="wrap hero-grid">
    <div>
      <div class="badge" data-fade><i></i><span t="hero_badge"></span></div>
      <h1 class="h1" data-split t="hero_title"></h1>
      <p class="lead" data-fade style="margin-top:34px;max-width:560px" t="hero_sub"></p>
      <div data-fade style="display:flex;flex-wrap:wrap;gap:14px;margin-top:40px">
        <a class="btn btn-v" data-magnetic href="/contact/"><span t="cta_book"></span>{{ARROW}}</a>
        <a class="btn btn-o" data-magnetic href="/services/" t="cta_services"></a>
      </div>
    </div>
    <div class="hero-mark" data-tilt>
      <svg role="img" aria-label="Tsahim-Ur logo" data-mark viewBox="-40 -40 936 810">
        <g fill="none" stroke="#A675F0" stroke-width="3">
          <circle data-pulse cx="776" cy="228" r="84"/><circle data-pulse cx="86" cy="362" r="80"/><circle data-pulse cx="380" cy="640" r="88"/><circle data-pulse cx="358" cy="86" r="82"/>
        </g>
        <g fill="none" stroke="#8636DF" stroke-width="70" stroke-linecap="round" stroke-linejoin="round">
          <polyline data-conn points="358,86 504,226 646,366 776,228"/>
          <polyline data-conn points="646,366 512,500 380,640 228,500 86,362"/>
        </g>
        <g fill="#8636DF">
          <circle data-node cx="86" cy="362" r="80"/><circle data-node cx="228" cy="500" r="82"/><circle data-node cx="380" cy="640" r="88"/><circle data-node cx="512" cy="500" r="84"/><circle data-node cx="646" cy="366" r="82"/><circle data-node cx="504" cy="226" r="84"/><circle data-node cx="358" cy="86" r="82"/><circle data-node cx="776" cy="228" r="84"/>
        </g>
        <g fill="#D8D7DC"><circle data-silver cx="222" cy="224" r="76"/><circle data-silver cx="358" cy="356" r="78"/></g>
      </svg>
    </div>
  </div>
  <div class="wrap g4 stats" data-fade>
    <div><div class="num"><span data-count="2014">2014</span></div><div class="small" style="margin-top:6px" t="stat1"></div></div>
    <div><div class="num"><span data-count="6">6</span></div><div class="small" style="margin-top:6px" t="stat2"></div></div>
    <div><div class="num"><span data-count="6">6</span></div><div class="small" style="margin-top:6px" t="stat3"></div></div>
    <div><div class="num">MN<span class="ac"> · </span>EN</div><div class="small" style="margin-top:6px" t="stat4"></div></div>
  </div>
</section>

<section class="strip" aria-labelledby="strip-label">
  <div class="wrap mono" id="strip-label" style="font-size:11px;letter-spacing:.18em;color:var(--mist);margin-bottom:18px;text-transform:uppercase" t="strip_label"></div>
  <div class="strip-track">
    <div class="marquee" data-marquee>
      {{STRIP}}{{STRIP_HIDDEN}}
    </div>
  </div>
</section>

<section style="padding:150px 0 120px">
  <div class="wrap">
    <div class="head-row">
      <div><div class="eyebrow" data-reveal t="hs_eyebrow"></div><h2 class="h2" data-reveal t="hs_title"></h2></div>
      <a class="arrow-link" data-reveal href="/services/" t="hs_all"></a>
    </div>
    <div class="g3">
{{SERVICE_CARDS}}
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap split" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);align-items:start">
    <div>
      <div class="eyebrow" data-reveal t="hi_eyebrow"></div>
      <h2 class="h2 sm" data-reveal t="hi_title"></h2>
      <a class="arrow-link" data-reveal href="/solutions/" style="margin-top:28px" t="hi_link"></a>
    </div>
    <div data-reveal style="display:flex;flex-wrap:wrap;gap:12px">
      <span class="pill" t="chip1"></span><span class="pill" t="chip2"></span><span class="pill" t="chip3"></span><span class="pill" t="chip4"></span><span class="pill" t="chip5"></span><span class="pill" t="chip6"></span><span class="pill" t="chip7"></span><span class="pill" t="chip8"></span><span class="pill" t="chip9"></span>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="eyebrow" data-reveal t="why_eyebrow"></div>
    <h2 class="h2" data-reveal style="margin-bottom:60px" t="why_title"></h2>
    <div class="g4">
      <div class="card pad" data-stagger><span class="mono ac" style="font-size:13px">01</span><h3 class="h3" t="why1_t"></h3><p class="body" t="why1_d"></p></div>
      <div class="card pad" data-stagger><span class="mono ac" style="font-size:13px">02</span><h3 class="h3" t="why2_t"></h3><p class="body" t="why2_d"></p></div>
      <div class="card pad" data-stagger><span class="mono ac" style="font-size:13px">03</span><h3 class="h3" t="why3_t"></h3><p class="body" t="why3_d"></p></div>
      <div class="card pad" data-stagger><span class="mono ac" style="font-size:13px">04</span><h3 class="h3" t="why4_t"></h3><p class="body" t="why4_d"></p></div>
    </div>
  </div>
</section>

<section class="section" data-path-sec style="padding-bottom:160px">
  <div class="wrap">
    <div class="eyebrow" data-reveal t="how_eyebrow"></div>
    <h2 class="h2" data-reveal style="margin-bottom:70px" t="how_title"></h2>
    <div class="path">
      <div class="path-line" aria-hidden="true"><i data-pathline></i></div>
      <ol class="g4" style="position:relative;margin:0;padding:0;list-style:none">
        <li class="step"><span class="step-node">1</span><h3 class="h3" t="how1_t"></h3><p class="body" t="how1_d"></p></li>
        <li class="step"><span class="step-node">2</span><h3 class="h3" t="how2_t"></h3><p class="body" t="how2_d"></p></li>
        <li class="step"><span class="step-node">3</span><h3 class="h3" t="how3_t"></h3><p class="body" t="how3_d"></p></li>
        <li class="step"><span class="step-node silver">4</span><h3 class="h3" t="how4_t"></h3><p class="body" t="how4_d"></p></li>
      </ol>
    </div>
  </div>
</section>

<section class="section" style="padding-bottom:160px">
  <div class="wrap">
    <div class="card split" data-reveal style="padding:56px;align-items:center;gap:48px">
      <div><div class="eyebrow" style="margin-bottom:20px" t="ha_eyebrow"></div><h2 class="h2 sm" t="ha_title"></h2></div>
      <div style="display:flex;flex-direction:column;gap:24px;align-items:flex-start"><p class="lead" style="font-size:17px" t="ha_body"></p><a class="arrow-link" href="/about/" t="ha_link"></a></div>
    </div>
  </div>
</section>
